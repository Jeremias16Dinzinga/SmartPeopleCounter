<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>SmartPeopleCounter</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="bg-danger text-white py-3 mb-4">
    <div class="container text-center">
        <h1><i class="fa-solid fa-people-group"></i> SmartPeopleCounter</h1>
    </div>
</header>

<main class="container">

    <div id="alertText" class="alert alert-danger text-center fs-5 fw-bold d-none"></div>

    <div class="row g-4 justify-content-center mb-4">
        <div class="col-md-3">
            <div class="card text-center shadow-sm border-0">
                <div class="card-body">
                    <i class="fa-solid fa-door-open fa-3x text-success mb-2"></i>
                    <h5 class="card-title text-danger">Entradas</h5>
                    <p id="entered" class="display-4 fw-bold">0</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm border-0">
                <div class="card-body">
                    <i class="fa-solid fa-door-closed fa-3x text-danger mb-2"></i>
                    <h5 class="card-title text-danger">Saídas</h5>
                    <p id="exited" class="display-4 fw-bold">0</p>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow-sm border-3 border-danger">
                <div class="card-body">
                    <i class="fa-solid fa-users fa-3x mb-2"></i>
                    <h5 class="card-title text-danger">Total Atual</h5>
                    <p id="current" class="display-4 fw-bold">0</p>
                </div>
            </div>
        </div>
    </div>

    <section class="history mb-5">
        <h2 class="text-center text-danger mb-3">Últimos 25 Históricos</h2>
        <div class="table-responsive shadow-sm">
            <table class="table table-striped table-hover align-middle text-center">
                <thead class="table-danger">
                    <tr>
                        <th>Horário</th>
                        <th>Entradas</th>
                        <th>Saídas</th>
                        <th>Atual</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
